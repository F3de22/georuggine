[package]
name = "georuggine-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Client Georuggine: invia la posizione del veicolo e mostra la flotta in TUI"

[lib]
name = "georuggine_client"
path = "src/lib.rs"

[[bin]]
name = "georuggine-client"
path = "src/main.rs"

[dependencies]
georuggine-common = { workspace = true }

tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rand = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }

[dev-dependencies]
# Serve solo ai test: `tokio::time::pause`/`advance` per verificare il ticker delle
# posizioni senza aspettare i tempi reali. Non e' abilitata nella build di produzione.
tokio = { workspace = true, features = ["test-util"] }
